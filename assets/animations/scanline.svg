<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 96" role="img" aria-labelledby="title desc">
  <title id="title">Subtle AI scanline animation</title>
  <desc id="desc">A restrained electric-blue scanline moving across a dark panel, with a crimson signal marker. If animation is unavailable, a static signal frame remains visible.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45C7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#45C7FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#45C7FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="96" rx="14" fill="#0B1220" stroke="#929BAA" stroke-opacity="0.18"/>
  <path d="M24 48H1576" stroke="#929BAA" stroke-opacity="0.18"/>
  <g opacity="0.72" filter="url(#glow)">
    <path d="M24 48H1576" stroke="url(#fade)" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 1552;260 1292;0 1552" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-260;-520" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FF2638">
    <circle cx="48" cy="48" r="5"/>
    <circle cx="48" cy="48" r="12" fill="none" stroke="#FF2638" stroke-opacity="0.28">
      <animate attributeName="r" values="8;18;8" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.05;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#929BAA" font-family="monospace" font-size="11" letter-spacing="3">
    <text x="72" y="43">LIVE SIGNAL</text>
    <text x="72" y="61" opacity="0.62">MOTION / INFERENCE / STORY</text>
    <text x="1518" y="53" text-anchor="end" opacity="0.62">HD-01</text>
  </g>
</svg>
